# Pull-request checks for the site and its tools. Deterministic only:
# every market-data provider is mocked, no API key or secret is used, and the
# optional live tests (_tools/tests/browser/live.test.js, live_fx_matrix.mjs) are
# not run here. Read-only token; third-party actions are pinned to commit SHAs.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"
  PLAYWRIGHT_VERSION: "1.63.0"

jobs:
  unit:
    name: Unit, reference and packaging checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Full history: test_engine_parity.py compares the rebalancer with the
          # legacy browser engine from an earlier commit (it skips in a shallow clone).
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: _tools/tests/requirements.txt
      - name: JavaScript unit tests (market data, providers, integrity, analytics, Monte Carlo, CPI engine, both gateways, free source; mocked network)
        run: node --test _tools/tests/unit/*.test.mjs
      - name: Desktop copies of the shared market_data package match _tools/shared_py
        run: python _tools/sync_shared_py.py --check
      - name: Public CPI workbook has no S&P 500 values, cached results or local metadata
        run: python _tools/cpi_public_workbook.py --check
      - name: Install Python test dependencies
        run: python -m pip install -r _tools/tests/requirements.txt
      - name: Python reference and parity tests (browser engines vs desktop engines incl. CPI CSV byte parity, numpy/scipy, hand-calculated cases)
        working-directory: _tools/tests
        run: python -m pytest -q -rfs -m "not e2e"
      - name: Downloadable ZIPs match a fresh deterministic build
        run: python _tools/build_project_zips.py --check
      - name: Rendered launchers match their templates
        run: python _tools/bootstrap/render.py --check

  browser:
    name: Site build and browser tests (mocked providers)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Choose a build directory outside the checkout
        run: echo "SITE_DIR=$RUNNER_TEMP/site" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # Default (development) environment: production mode makes the github-metadata
      # plugin call the GitHub API during the build, which would make CI depend on
      # unauthenticated rate limits. The only production-only template branch here is
      # the analytics include, which this site does not configure.
      - name: Build the site (strict front matter)
        run: bundle exec jekyll build --strict_front_matter -d "$SITE_DIR"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Playwright with Chromium, and openpyxl for workbook checks
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          python -m pip install openpyxl==3.1.5
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Serve the built site on 127.0.0.1:4000
        run: |
          python -m http.server 4000 --bind 127.0.0.1 --directory "$SITE_DIR" > "$RUNNER_TEMP/http.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:4000/projects/ && exit 0; sleep 1; done
          echo "::error::local server did not start"; cat "$RUNNER_TEMP/http.log"; exit 1
      # Each suite prints PASS/FAIL per check and exits non-zero on any failure.
      # harness.js answers the Bank of Canada, ECB, Alpha Vantage, Marketstack,
      # Finnhub, Statistics Canada and a stand-in data gateway with synthetic data, runs
      # the real market-data gateway code with synthetic Yahoo answers (Yahoo is never
      # contacted), and aborts (and fails on) every other host;
      # Chart.js is self-hosted, so no CDN is contacted.
      - name: Pages (all project pages, guides, redirects, ZIP links, phone width)
        working-directory: _tools/tests/browser
        run: node pages.test.js
      - name: Stock Comparison web app
        working-directory: _tools/tests/browser
        run: node stock.test.js
      - name: Portfolio Rebalancer web app
        working-directory: _tools/tests/browser
        run: node rebalancer.test.js
      - name: Monte Carlo web app
        working-directory: _tools/tests/browser
        run: node montecarlo.test.js
      # Statistics Canada and the data gateway are mocked; no FRED key or gateway is used.
      - name: CPI Web Scraper web app
        working-directory: _tools/tests/browser
        run: node cpi.test.js
      # The market-data gateway's Worker code runs in this job with synthetic Yahoo
      # answers; no gateway is deployed and no live request is made.
      - name: Free source (keyless market-data gateway) in the Rebalancer and Stock web apps
        working-directory: _tools/tests/browser
        run: node freesource.test.js

  desktop:
    name: Desktop tests on Linux (${{ matrix.tool }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: portfolio-rebalancer-tool
            select: ""
          - tool: monte-carlo-retirement-simulator
            select: ""
          - tool: Stock-Data-Dashboard-Tool
            select: ""
          # The CPI scraper's launcher only supports Windows with desktop Excel, so
          # these six bootstrap tests are Windows-only by design and are NOT run on
          # Linux (they are excluded, not reported as passing). Run them on Windows:
          #   python -m pytest -q files/tests/test_bootstrap.py
          - tool: CPI-Webscraper
            select: >-
              not test_healthy_repeat and not test_missing_broken_venv and
              not test_stale_or_missing_import and not test_malformed_config_stops_repair
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: projects/${{ matrix.tool }}/scripts/requirements.txt
      - name: Install the tool's pinned requirements (pywin32 is Windows-only and skipped)
        run: |
          grep -vi '^pywin32' "projects/${{ matrix.tool }}/scripts/requirements.txt" > "$RUNNER_TEMP/requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements.txt" pytest==9.1.1
          python -c "import tkinter" || { echo "::error::tkinter is not available in this Python"; exit 1; }
      - name: Install Xvfb for the Tk window smoke tests
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb
      - name: Run the tool's tests
        working-directory: projects/${{ matrix.tool }}
        env:
          MPLBACKEND: Agg
          SELECT: ${{ matrix.select }}
        run: |
          mkdir -p files/run-temp
          # The Tk smoke tests (test_ui_smoke.py / test_gui_smoke.py) need a display:
          # a 1366x768 virtual screen. They do not replace manual checks on Windows.
          if [ -n "$SELECT" ]; then
            echo "Windows-only tests excluded on Linux: $SELECT" >> "$GITHUB_STEP_SUMMARY"
            xvfb-run -a -s "-screen 0 1366x768x24" python -m pytest -q -rf -p no:cacheprovider files/tests -k "$SELECT"
          else
            xvfb-run -a -s "-screen 0 1366x768x24" python -m pytest -q -rf -p no:cacheprovider files/tests
          fi
