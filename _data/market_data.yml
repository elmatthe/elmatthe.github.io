# Shared market-data gateway for the Portfolio Rebalancer and Stock Comparison web apps
# (_services/market-data-gateway, a Cloudflare Worker). It provides the "free source"
# that needs no API key.
#
# Keep this EMPTY until the owner has deployed the Worker and checked its /v1/health
# (README.md in that folder, "Deploy" and "Verify"). While it is empty, both pages say
# the free source is not available and send it nothing.
#
# The Worker serves prices only after its own activation gate is cleared (written
# permission for automated retrieval and public redistribution recorded in its
# settings). Pointing the site at a deployed Worker whose source is still switched off
# is safe: the pages then say "switched off" and request no prices from it.
#
# Value: the Worker's https URL with no trailing slash, for example
#   gateway: "https://market-data-gateway.<your-subdomain>.workers.dev"
gateway: ""
